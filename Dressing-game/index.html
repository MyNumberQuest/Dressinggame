<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>옷 입히기 게임</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
      :root{--bg:#ece7f7;--panel:#fff;--ink:#2b2540;--mute:#7a7396;--line:#d9d2ee;--acc:#3dbe9b;--accink:#06382c;--pop:#ff7a7a;
          box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a30;--panel:#2a2542;--ink:#f1edff;--mute:#a49dc4;--line:#433c66;--accink:#06382c;color-scheme:dark}}
      :root[data-theme="dark"]{--bg:#1e1a30;--panel:#2a2542;--ink:#f1edff;--mute:#a49dc4;--line:#433c66;--accink:#06382c;color-scheme:dark}
      html{scroll-padding-top:env(safe-area-inset-top,0px)}
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px}
      main{max-width:860px;margin:0 auto;padding:20px 16px 32px}
      h1{font-size:28px;margin:0 0 4px;font-weight:400}
      .sub{margin:0 0 18px;color:var(--mute)}
      .game{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
      .stage{flex:0 1 300px;margin:0 auto;width:100%;max-width:320px}
      #doll{width:100%;display:block;border-radius:28px;border:3px solid var(--ink);background:var(--panel)}
      .row{display:flex;gap:10px;margin-top:12px}
      .row button{flex:1}
      .panel{flex:1 1 300px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px}
      .gender{display:flex;gap:8px;margin-bottom:12px}
      .pick{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mute)}
      .pick input{width:46px;height:36px;border:2px solid var(--line);border-radius:10px;padding:0;background:none;cursor:pointer}
      .sign{background:repeating-linear-gradient(90deg,var(--pop) 0 22px,#fff 22px 44px);border-radius:12px 12px 4px 4px;padding:10px 14px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:20px;box-shadow:0 6px 0 -2px rgba(0,0,0,.14)}
      .sign b{background:var(--panel);color:var(--ink);padding:2px 14px;border-radius:999px;font-weight:400}
      .sign small{background:var(--acc);color:var(--accink);padding:2px 10px;border-radius:999px;font-size:14px}
      .tag{border-style:dashed;text-align:left}
      .tag small{display:block;color:var(--mute);font-size:14px}
      .rcpt{font-family:'Courier New',monospace;font-size:14px;background:#fffdf5;color:#2b2540;border:1px solid #d9d2ee;padding:8px 12px;margin:8px 0;border-radius:4px}
      .rcpt div{display:flex;justify-content:space-between}
      .rcpt .sum{border-top:1px dashed #2b2540;margin-top:4px;padding-top:4px}
      .modes{display:flex;gap:8px;margin-bottom:16px}
      .stats{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;color:var(--mute);margin-bottom:8px}
      .vip{background:#e8b04a;color:#3a2a00;border-radius:6px;padding:0 6px;font-size:14px;margin-right:6px}
      .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
      .bar i{display:block;height:100%;background:var(--acc)}
      .act small{color:var(--mute);font-size:14px}
      .bubble{background:var(--bg);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:10px 14px;margin-bottom:12px}
      .bubble p{margin:6px 0 0}
      .res{border:2px dashed var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
      .res ul{margin:6px 0;padding:0;list-style:none}
      .stars{font-size:24px;color:#e8b04a}
      #shop .act{width:100%;margin-bottom:12px}
      .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
      button{font:inherit;color:var(--ink);cursor:pointer}
      .tab{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px}
      .tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
      h2{font-size:16px;font-weight:400;color:var(--mute);margin:12px 0 8px}
      .chips,.sw{display:flex;flex-wrap:wrap;gap:8px}
      .chip{border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 14px}
      .chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
      .dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);padding:0}
      .dot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
      .act{border:2px solid var(--ink);background:var(--panel);border-radius:14px;padding:10px}
      .act.pop{background:var(--pop);color:#3a0d0d}
      button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
      @media (prefers-reduced-motion:no-preference){.bounce{animation:b .35s}@keyframes b{50%{transform:scale(1.02) rotate(-.6deg)}}}
  </style>
</head>
<body>
<main>
  <h1>옷 입히기 게임</h1>
  <p class="sub">머리부터 신발까지 골라서 꾸미거나, 가게에서 손님에게 옷을 추천해 보세요.</p>
  <div class="modes" id="modes"></div>
  <div class="game">
    <div class="stage">
      <svg id="doll" viewBox="0 0 240 400" role="img" aria-label="꾸미는 중인 캐릭터"></svg>
      <div class="row" id="acts">
        <button class="act pop" id="rnd">랜덤으로 입히기</button>
        <button class="act" id="rst">처음으로</button>
      </div>
    </div>
    <section class="panel">
      <div id="shop" hidden></div>
      <div class="gender" id="gender" role="group" aria-label="성별"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="opts"></div>
    </section>
  </div>
</main>
<script>
  var CATS=[
    {id:'hair',label:'머리',styles:['짧은 머리','긴 머리','똥머리','양갈래','단발머리','포니테일'],m:['짧은 머리','스포츠머리','올백','덥수룩','투블럭','곱슬머리'],colors:['#2b2540','#6b4226','#e8b04a','#d94f6b','#5b7cf0','#eeeeee']},
    {id:'top',label:'상의',styles:['티셔츠','후드티','원피스','민소매','스웨터'],m:['티셔츠','후드티','셔츠','민소매','스웨터'],colors:['#ff7a7a','#ffd24a','#3dbe9b','#5b7cf0','#b57bee','#ffffff','#2b2540']},
    {id:'bottom',label:'하의',styles:['바지','치마','반바지','롱스커트','레깅스'],m:['바지','반바지','7부 바지','넓은 바지','슬림 바지'],colors:['#4a63c9','#2b2540','#ff9ec4','#8fd3a8','#e8d9a8','#c9c9d6']},
    {id:'shoes',label:'신발',styles:['운동화','부츠','샌들','하이탑','로퍼'],colors:['#ffffff','#2b2540','#d94f6b','#8a5a36','#ffd24a','#5b7cf0']},
    {id:'outer',label:'외투',styles:['없음','가디건','재킷','패딩','조끼','코트'],colors:['#e8d9a8','#2b2540','#d94f6b','#5b7cf0','#3dbe9b','#ffffff']},
    {id:'socks',label:'양말',styles:['없음','짧은 양말','긴 양말','줄무늬 양말','무릎 위 양말','물방울 양말'],colors:['#ffffff','#2b2540','#ff7a7a','#ffd24a','#5b7cf0','#3dbe9b']},
    {id:'bag',label:'가방',styles:['없음','백팩','크로스백','토트백','숄더백','힙색'],colors:['#8a5a36','#2b2540','#ff7a7a','#ffd24a','#3dbe9b','#5b7cf0']},
    {id:'acc',label:'소품',styles:['없음','안경','선글라스','모자','리본','왕관','비니','머리띠'],colors:['#2b2540','#ff7a7a','#ffd24a','#3dbe9b','#5b7cf0','#ffffff']},
    {id:'face',label:'표정',styles:['미소','활짝 웃음','윙크','놀람','시무룩'],colors:[]},
    {id:'pose',label:'포즈',styles:['차렷','손 흔들기','만세','팔 벌리기'],colors:[]},
    {id:'skin',label:'피부',styles:null,colors:['#ffe0c7','#f7c9a3','#e0a678','#b97b50','#8a5a38']},
    {id:'bg',label:'배경',styles:null,colors:['#fff1c9','#cfeee3','#d5e1ff','#ffd9e4','#e6dcff','#2f2a4a']}
  ];
  (function(){
    var MORE=['#ff9ec4','#ff9f40','#a3e635','#38bdf8','#1e3a8a','#7c3aed','#be123c','#6b7280','#92400e','#fde68a','#0f766e','#f472b6'];
    var SKIN=['#fff0e0','#fbe5d6','#e9b98f','#c68a5e','#6f4426','#4a2c17'];
    CATS.forEach(function(c){
      var extra=c.id==='skin'?SKIN:(c.colors.length?MORE:[]);
      extra.forEach(function(k){if(c.colors.indexOf(k)<0)c.colors.push(k)});
    });
  })();
  var DEF={hair:[0,0],top:[0,0],bottom:[0,0],shoes:[0,0],outer:[0,0],socks:[0,0],bag:[0,0],acc:[0,0],face:[0,0],pose:[0,0],skin:[0,0],bg:[0,0]};
  var sel,tab='hair',g='f',mode='play';
  function reset(){sel=JSON.parse(JSON.stringify(DEF))}
  reset();
  function col(id){var c=CATS.filter(function(x){return x.id===id})[0];return sel[id][2]||c.colors[sel[id][1]]}
  function shade(h,a){var n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
    function f(v){return Math.max(0,Math.min(255,Math.round(v+a)))}
    return 'rgb('+f(r)+','+f(g)+','+f(b)+')'}

  function eyes(e){
    var d='#2b2540',dot=function(x,r){return '<circle cx="'+x+'" cy="96" r="'+r+'" fill="'+d+'"/><circle cx="'+(x-1.5)+'" cy="94.5" r="1.4" fill="#fff"/>'},
      arc=function(x){return '<path d="M'+(x-7)+' 98 Q'+x+' 88 '+(x+7)+' 98" fill="none" stroke="'+d+'" stroke-width="3.5" stroke-linecap="round"/>'};
    if(e===1)return arc(104)+arc(136);
    if(e===2)return dot(104,4.5)+arc(136);
    if(e===3)return dot(104,6.5)+dot(136,6.5);
    if(e===4)return dot(104,4.5)+dot(136,4.5)+'<path d="M96 86 L112 90 M144 86 L128 90" stroke="'+d+'" stroke-width="3" stroke-linecap="round"/>';
    return dot(104,4.5)+dot(136,4.5);
  }
  function mouth(e){
    var d='#2b2540';
    if(e===1)return '<path d="M108 107 Q120 128 132 107Z" fill="#7a2d3a" stroke="'+d+'" stroke-width="2.5" stroke-linejoin="round"/>';
    if(e===3)return '<ellipse cx="120" cy="115" rx="5" ry="7" fill="#7a2d3a" stroke="'+d+'" stroke-width="2.5"/>';
    if(e===4)return '<path d="M110 117 Q120 108 130 117" fill="none" stroke="'+d+'" stroke-width="3" stroke-linecap="round"/>';
    return '<path d="M110 110 Q120 119 130 110" fill="none" stroke="'+d+'" stroke-width="3" stroke-linecap="round"/>';
  }
  function poseUp(u){
    var A=[[0,0],[0,-150],[150,-150],[35,-35]][sel.pose[0]];
    if(!A[0]&&!A[1])return u;
    var L='',R='';
    u=u.replace(/<rect x="(\d+)"[^>]*\/>/g,function(m,x){x=+x;if(x<=60){L+=m;return ''}if(x>=156){R+=m;return ''}return m});
    return u+'<g transform="rotate('+A[0]+' 70 146)">'+L+'</g><g transform="rotate('+A[1]+' 170 146)">'+R+'</g>';
  }
  function draw(){
    var skin=col('skin'),hc=col('hair'),tc=col('top'),bc=col('bottom'),sc=col('shoes'),ac=col('acc'),bg=col('bg');
    var M=g==='m',sk=sel.socks[0],ph=sk?100:112,OU=sel.outer[0],BG=sel.bag[0],oc=col('outer'),gc=col('bag'),kc=col('socks'),hs=sel.hair[0],ts=sel.top[0],bs=sel.bottom[0],ss=sel.shoes[0],as=sel.acc[0];
    var o='<rect width="240" height="400" fill="'+bg+'"/><ellipse cx="120" cy="372" rx="70" ry="9" fill="rgba(0,0,0,.15)"/>';
    if(mode==='shop'){o+='<rect x="0" y="356" width="240" height="44" fill="rgba(0,0,0,.08)"/><rect x="8" y="18" width="224" height="5" rx="2" fill="#8a5a36"/>';[[16,'#ff7a7a'],[42,'#5b7cf0'],[172,'#ffd24a'],[198,'#3dbe9b']].forEach(function(p){o+='<path d="M'+(p[0]+11)+' 23 v6" stroke="#8a5a36" stroke-width="2"/><rect x="'+p[0]+'" y="29" width="22" height="26" rx="4" fill="'+p[1]+'"/>'})}
    // back hair
    if(hs===1&&!M)o+='<rect x="76" y="70" width="88" height="130" rx="30" fill="'+hc+'"/>';
    if(hs===3&&!M)o+='<circle cx="72" cy="112" r="20" fill="'+hc+'"/><circle cx="168" cy="112" r="20" fill="'+hc+'"/>';
    if(hs===2&&!M)o+='<circle cx="120" cy="40" r="20" fill="'+hc+'"/>';
    if(hs===4&&!M)o+='<rect x="76" y="70" width="88" height="72" rx="26" fill="'+hc+'"/>';
    if(hs===5&&!M)o+='<rect x="158" y="82" width="18" height="78" rx="9" fill="'+hc+'"/><circle cx="162" cy="84" r="12" fill="'+hc+'"/>';
    // legs
    o+='<rect x="95" y="240" width="22" height="115" rx="8" fill="'+skin+'"/><rect x="123" y="240" width="22" height="115" rx="8" fill="'+skin+'"/>';
    if(sk){var sy=sk===1?332:(sk===4?262:286);[95,123].forEach(function(x){o+='<rect x="'+x+'" y="'+sy+'" width="22" height="'+(352-sy)+'" rx="7" fill="'+kc+'"/>';if(sk===5){for(var y=sy+10;y<346;y+=16)o+='<circle cx="'+(x+11)+'" cy="'+y+'" r="3" fill="'+shade(kc,-110)+'"/>'}if(sk===3){for(var y=sy+6;y<346;y+=14)o+='<rect x="'+x+'" y="'+y+'" width="22" height="6" fill="'+shade(kc,-110)+'"/>'}})}
    // bottom
    if(ts!==2||M){
      if(bs===0)o+='<rect x="92" y="236" width="27" height="'+ph+'" rx="6" fill="'+bc+'"/><rect x="121" y="236" width="27" height="'+ph+'" rx="6" fill="'+bc+'"/>';
      if(bs===1&&!M)o+='<path d="M86 236 H154 L168 310 H72Z" fill="'+bc+'"/><path d="M86 236 H154" stroke="'+shade(bc,-40)+'" stroke-width="4"/>';
      if(bs===2&&M)o+='<rect x="92" y="236" width="27" height="86" rx="6" fill="'+bc+'"/><rect x="121" y="236" width="27" height="86" rx="6" fill="'+bc+'"/>';
      if((bs===2&&!M)||(bs===1&&M))o+='<rect x="90" y="236" width="29" height="58" rx="6" fill="'+bc+'"/><rect x="121" y="236" width="29" height="58" rx="6" fill="'+bc+'"/>';
    }
    if((ts!==2||M)&&bs===3){if(M)o+='<rect x="88" y="236" width="31" height="'+ph+'" rx="6" fill="'+bc+'"/><rect x="121" y="236" width="31" height="'+ph+'" rx="6" fill="'+bc+'"/>';else o+='<path d="M86 236 H154 L172 340 H68Z" fill="'+bc+'"/><path d="M86 236 H154" stroke="'+shade(bc,-40)+'" stroke-width="4"/>'}
    if((ts!==2||M)&&bs===4)o+='<rect x="96" y="236" width="21" height="'+ph+'" rx="8" fill="'+bc+'"/><rect x="123" y="236" width="21" height="'+ph+'" rx="8" fill="'+bc+'"/>';
    // shoes
    [[89,0],[123,1]].forEach(function(p){var x=p[0];
      if(ss===0)o+='<rect x="'+x+'" y="344" width="30" height="16" rx="8" fill="'+sc+'"/><rect x="'+x+'" y="355" width="30" height="6" rx="3" fill="'+shade('#808080',90)+'" stroke="#2b2540" stroke-width="1"/>';
      if(ss===1)o+='<rect x="'+(x+2)+'" y="318" width="26" height="40" rx="7" fill="'+sc+'"/><rect x="'+x+'" y="348" width="32" height="13" rx="6" fill="'+shade(sc,-35)+'"/>';
      if(ss===3)o+='<rect x="'+(x+2)+'" y="330" width="26" height="28" rx="7" fill="'+sc+'"/><rect x="'+x+'" y="352" width="32" height="9" rx="4" fill="#fff" stroke="#2b2540" stroke-width="1"/>';
      if(ss===4)o+='<rect x="'+x+'" y="348" width="30" height="13" rx="6" fill="'+sc+'"/><rect x="'+x+'" y="358" width="30" height="3" fill="'+shade(sc,-60)+'"/>';
      if(ss===2)o+='<rect x="'+x+'" y="354" width="30" height="7" rx="3" fill="'+sc+'"/><rect x="'+(x+12)+'" y="346" width="6" height="10" fill="'+sc+'"/>';
    });
    var base=o;o='';
    // arms
    var longSleeve=ts===1;
    o+='<rect x="60" y="146" width="20" height="100" rx="10" fill="'+skin+'"/><rect x="160" y="146" width="20" height="100" rx="10" fill="'+skin+'"/>';
    // top
    if(ts===0)o+='<rect x="80" y="140" width="80" height="102" rx="14" fill="'+tc+'"/><rect x="58" y="142" width="24" height="42" rx="10" fill="'+tc+'"/><rect x="158" y="142" width="24" height="42" rx="10" fill="'+tc+'"/>';
    if(ts===1)o+='<rect x="80" y="140" width="80" height="106" rx="14" fill="'+tc+'"/><rect x="58" y="142" width="24" height="98" rx="11" fill="'+tc+'"/><rect x="158" y="142" width="24" height="98" rx="11" fill="'+tc+'"/><rect x="100" y="205" width="40" height="26" rx="8" fill="'+shade(tc,-30)+'"/><path d="M104 140 Q120 170 136 140" fill="none" stroke="'+shade(tc,-45)+'" stroke-width="6" stroke-linecap="round"/>';
    if(ts===2&&M)o+='<rect x="80" y="140" width="80" height="104" rx="12" fill="'+tc+'"/><rect x="58" y="142" width="24" height="96" rx="11" fill="'+tc+'"/><rect x="158" y="142" width="24" height="96" rx="11" fill="'+tc+'"/><path d="M104 140 L120 164 L136 140Z" fill="#fff"/><path d="M120 164 V244" stroke="'+shade(tc,-45)+'" stroke-width="3"/>';
    if(ts===2&&!M)o+='<path d="M84 140 H156 L166 130 V150 L176 312 H64 L74 150 V130Z" fill="'+tc+'" opacity="0"/><path d="M82 140 H158 L176 312 H64Z" fill="'+tc+'"/><rect x="58" y="142" width="24" height="34" rx="10" fill="'+tc+'"/><rect x="158" y="142" width="24" height="34" rx="10" fill="'+tc+'"/><rect x="82" y="196" width="76" height="8" fill="'+shade(tc,-45)+'"/>';
    if(ts===3)o+='<rect x="84" y="140" width="72" height="102" rx="14" fill="'+tc+'"/><path d="M100 140 Q120 164 140 140Z" fill="'+skin+'"/>';
    if(ts===4)o+='<rect x="80" y="140" width="80" height="106" rx="14" fill="'+tc+'"/><rect x="58" y="142" width="24" height="98" rx="11" fill="'+tc+'"/><rect x="158" y="142" width="24" height="98" rx="11" fill="'+tc+'"/><rect x="80" y="232" width="80" height="14" rx="6" fill="'+shade(tc,-30)+'"/><path d="M96 140 Q120 156 144 140" fill="none" stroke="'+shade(tc,-40)+'" stroke-width="7" stroke-linecap="round"/>';

  function bud(){return Math.round(cur.b*D.bm*(isVip?2:1)/1000)*1000}
  function selectHtml(){
    return '<div class="sign"><b>우리 옷 가게</b><small>오픈 준비</small></div><div class="bubble"><p>난이도를 골라 주세요. 목표 매출을 모으면 클리어예요!</p></div>'+DIFF.map(function(d,i){return'<button class="act" data-lv="'+i+'">'+d.n+' · 목표 '+won(d.target)+'<br><small>하루 목표 '+won(d.g0)+'부터 · '+(d.lives?'기회 '+d.lives+'번':'기회 무제한')+'</small></button>'}).join('');
  }
  function startGame(i){D=DIFF[i];day=1;dayN=0;daySales=0;sales=0;served=0;regs=[];lives=D.lives;last=-1;lastName='';rating=3;isVip=false;perDay=custCount();newCustomer()}
  function checkEnd(){
    if(!D||sales<D.target)return false;
    summary='<div class="res"><div class="stars">클리어!</div><p>'+D.n+' 난이도 목표 '+won(D.target)+'을 모았어요!</p><p>'+day+'일차 · 총 매출 '+won(sales)+' · 단골 '+regs.length+'명</p></div><button class="act pop" id="again">난이도 다시 고르기</button>';
    renderShop();return true;
  }
  function gameOver(){
    summary='<div class="res"><div class="stars">게임 오버</div><p>기회를 모두 잃었어요… '+D.n+' · '+day+'일차 · 총 매출 '+won(sales)+'</p></div><button class="act pop" id="again">난이도 다시 고르기</button>';
    renderShop();
  }
  function endDay(){
    var ok=daySales>=goal(),bonus=ok?Math.round(goal()*0.1):0;
    sales+=bonus;res=null;if(checkEnd())return;if(!ok&&D.lives){lives--;if(lives<=0){gameOver();return}}
    summary='<div class="res"><div class="stars">'+(ok?'영업 성공!':'아쉬워요')+'</div><p>'+day+'일차 매출 '+won(daySales)+' / 목표 '+won(goal())+'</p><p>'+(ok?'목표 달성 보너스 +'+won(bonus):'목표까지 '+won(goal()-daySales)+' 모자랐어요.'+(D.lives?' 남은 기회 '+lives+'번':''))+'</p></div><button class="act pop" id="nxt2">'+(ok?(day+1)+'일차 시작하기':'같은 날 다시 도전')+'</button>';
    renderShop();
  }
  function nextDay(){if(daySales>=goal())day++;dayN=0;daySales=0;summary=null;perDay=custCount();newCustomer()}
  function setMode(m){
    mode=m;res=null;
    document.getElementById('shop').hidden=m!=='shop';
    document.getElementById('gender').style.display=m==='shop'?'none':'flex';
    document.getElementById('acts').style.display=m==='shop'?'none':'flex';
    renderModes();
    if(m==='shop'){newCustomer()}else{tab='hair';reset();renderGender();renderTabs();update()}
  }
  function renderModes(){
    var w=document.getElementById('modes');w.innerHTML='';
    [['play','꾸미기'],['shop','옷 가게']].forEach(function(p){var b=document.createElement('button');b.className='chip';b.textContent=p[1];
      b.setAttribute('aria-pressed',mode===p[0]);b.onclick=function(){if(mode!==p[0])setMode(p[0])};w.appendChild(b)});
  }
  renderModes();renderGender();renderTabs();draw();renderOpts();
</script>
</body>
</html>
